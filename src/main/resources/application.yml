server:
  port: 8082
  error:
    include-message: always

spring:
  application:
    name: ms-andesstay-catalog
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USER:andesstay}
    password: ${ORACLE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.andesstay: INFO
    org.hibernate.SQL: WARN
